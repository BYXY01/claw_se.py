name: CI

run-name: ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test + build single file (Linux, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install langchain langchain-openai langchain-core python-dotenv psutil pytest pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes src_dev tests builder.py

      - name: Run unit tests (offline, no API keys)
        run: python -m pytest tests/unit_tests -q

      - name: Build single-file distribution
        run: python builder.py --out dist

      - name: Verify single file
        run: |
          test -f dist/claw_se.py
          python -m py_compile dist/claw_se.py
          grep -q "version = \"$(cat version.txt)\"" dist/claw_se.py

  exe:
    name: Build claw_se.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install langchain langchain-openai langchain-core python-dotenv psutil pyinstaller

      - name: Build single file + exe (PyInstaller onefile)
        run: python builder.py --exe --out dist

      - name: Verify exe exists
        shell: pwsh
        run: |
          Test-Path dist/claw_se.exe
          (Get-Item dist/claw_se.exe).Length -gt 100000

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw_se-exe
          path: dist/claw_se.exe
